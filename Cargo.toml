[package]
name = "cardano-lightning-relay"
version = "0.1.0"
authors = ["PolyCrypt GmbH"]
license = "Apache-2.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "cardano-lightning-relay"
path = "src/main.rs"

[dependencies]
cardano-lightning-client = { path = "../cardano-lightning-client" }

lightning = { version = "0.2.0", features = ["dnssec"] }
lightning-block-sync = { version = "0.2.0", features = [ "rpc-client", "tokio" ] }
lightning-dns-resolver = { version = "0.3.0" }
lightning-invoice = { version = "0.34.0" }
lightning-net-tokio = { version = "0.2.0" }
lightning-persister = { version = "0.2.0", features = [ "tokio" ] }
lightning-background-processor = { version = "0.2.0" }
lightning-rapid-gossip-sync = { version = "0.2.0" }
lightning-macros = { version = "0.2.0" }

base64 = "0.13.0"
bitcoin = "0.32"
hex = "0.4"
bitcoin-bech32 = "0.12"
bech32 = "0.8"
libc = "0.2"

axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rand = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tokio = { version = "1", features = [ "io-util", "macros", "rt", "rt-multi-thread", "sync", "net", "time", "io-std" ] }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
