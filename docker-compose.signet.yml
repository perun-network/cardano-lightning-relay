# Signet + Preprod deployment
#
# Runs the relay container alongside bitcoind for block sync.
#
# Setup:
#   1. Copy secrets/preprod.env.example to secrets/preprod.env and fill in values
#   2. Place operator.sk and script_cbor.hex in secrets/
#   3. Build: docker compose -f docker-compose.signet.yml build
#   4. Start bitcoind first, let it sync, then start the relay:
#      docker compose -f docker-compose.signet.yml up -d bitcoind
#      # Wait for sync: docker exec bitcoind bitcoin-cli -signet getblockchaininfo
#      docker compose -f docker-compose.signet.yml up -d relay
#
# The relay connects to bitcoind for block sync and uses the public
# mempool.space Esplora API for wallet operations (Esplora+BDK backend).

services:
  bitcoind:
    image: bitcoin/bitcoin:28.1
    container_name: bitcoind
    command: ["-signet", "-server", "-rpcbind=0.0.0.0", "-rpcallowip=172.0.0.0/8", "-rpcuser=relay", "-rpcpassword=relay"]
    volumes:
      - bitcoin-data:/home/bitcoin/.bitcoin
    ports:
      - "38332:38332"
    restart: unless-stopped
    # The relay's initial `getblockchaininfo` RPC call fails if bitcoind's
    # RPC server isn't yet listening — relay then exits via the bail in
    # main.rs and restart-policy retries. Gate the relay with a real
    # readiness check so its first start always succeeds.
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -signet -rpcuser=relay -rpcpassword=relay getblockchaininfo > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  relay:
    build:
      context: ..
      dockerfile: cardano-lightning-relay/Dockerfile
    container_name: relay
    depends_on:
      bitcoind:
        condition: service_healthy
    env_file:
      - secrets/preprod.env
    environment:
      - BITCOIN_ESPLORA_URL=https://mempool.space/signet/api
      - BITCOIN_WALLET_SEED_PATH=/data/wallet_seed.txt
      - LDK_MIN_CHANNEL_CONFIRMATIONS=1
      - CARDANO_ENABLED=1
      - CARDANO_API_PORT=3002
      - CARDANO_API_RATE_LIMIT_MAX=100
      - CARDANO_API_RATE_LIMIT_WINDOW_SECS=60
    volumes:
      - relay-data:/data
      - ./secrets:/secrets:ro
    ports:
      - "9735:9735"
      - "3002:3002"
    restart: unless-stopped
    # The relay binary runs an interactive LDK CLI on stdin. Without a TTY,
    # `next_line()` returns EOF and the process exits immediately. Keep stdin
    # open + allocate a pseudo-TTY so the CLI loop blocks instead.
    stdin_open: true
    tty: true
    command: ["relay:relay@bitcoind:38332", "/data/ldk_state", "9735", "signet"]

volumes:
  bitcoin-data:
  relay-data:
